<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="title description">
  <title id="title">PaperMind animated RAG workflow</title>
  <desc id="description">A document is uploaded, parsed, chunked and embedded. ChromaDB retrieves relevant passages for each question, Gemini writes a grounded answer, and the response includes source references.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 7 4 0 8" fill="none" stroke="#777" stroke-width="1.4" />
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".07" />
    </filter>
    <style>
      .canvas { fill: #fff; }
      .eyebrow { fill: #777; font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
      .headline { fill: #111; font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.7px; }
      .subhead { fill: #6b6b6b; font: 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .track { fill: none; stroke: #d8d8d8; stroke-width: 2; stroke-dasharray: 4 6; }
      .node-card { fill: #fff; stroke: #e2e2e2; stroke-width: 1.5; filter: url(#soft-shadow); animation: focus 7.7s ease-in-out infinite; }
      .step-0 { animation-delay: 0s; }
      .step-1 { animation-delay: 1.1s; }
      .step-2 { animation-delay: 2.2s; }
      .step-3 { animation-delay: 3.3s; }
      .step-4 { animation-delay: 4.4s; }
      .step-5 { animation-delay: 5.5s; }
      .step-6 { animation-delay: 6.6s; }
      .step-label { fill: #888; font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; }
      .node-title { fill: #111; font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node-copy { fill: #6b6b6b; font: 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .icon-stroke { fill: none; stroke: #222; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #f1f1f1; stroke: #222; stroke-width: 1.5; stroke-linejoin: round; }
      .dot { fill: #111; filter: drop-shadow(0 0 5px #1115); }
      .footer { fill: #777; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .7px; }
      @keyframes focus {
        0%, 13% { stroke: #111; fill: #f7f7f7; }
        18%, 100% { stroke: #e2e2e2; fill: #fff; }
      }
      @media (prefers-reduced-motion: reduce) {
        .node-card { animation: none; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1400" height="500" rx="22" />
  <text class="eyebrow" x="54" y="54">PAPERMIND / RETRIEVAL-AUGMENTED GENERATION</text>
  <text class="headline" x="54" y="96">From a document to an answer you can verify.</text>
  <text class="subhead" x="54" y="124">Index once. Retrieve relevant evidence for every question. Generate with grounded context.</text>

  <!-- Connector track, behind the workflow cards -->
  <path class="track" d="M210 277 H1190" marker-end="url(#arrow)" />
  <circle class="dot" r="5">
    <animateMotion path="M210 277 H1190" dur="7.7s" repeatCount="indefinite" />
  </circle>
  <circle class="dot" r="3.5" opacity=".45">
    <animateMotion path="M210 277 H1190" dur="7.7s" begin="2.56s" repeatCount="indefinite" />
  </circle>

  <!-- 01 PDF upload -->
  <g>
    <rect class="node-card step-0" x="50" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="68" y="216">01 / INPUT</text>
    <path class="icon-fill" d="M104 235h28l14 14v34h-42z" />
    <path class="icon-stroke" d="M132 235v15h14M111 261h18M111 268h18M111 275h12" />
    <text class="node-title" x="68" y="312">Upload PDF</text>
    <text class="node-copy" x="68" y="333">Text-based file</text>
    <text class="node-copy" x="68" y="350">sent to FastAPI</text>
  </g>

  <!-- 02 Extract -->
  <g>
    <rect class="node-card step-1" x="240" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="258" y="216">02 / PARSE</text>
    <path class="icon-stroke" d="M280 245h38M280 253h31M280 261h38M280 269h24M280 277h34" />
    <path class="icon-stroke" d="m326 250 7 7 13-15" />
    <text class="node-title" x="258" y="312">Extract text</text>
    <text class="node-copy" x="258" y="333">PyMuPDF reads</text>
    <text class="node-copy" x="258" y="350">each page</text>
  </g>

  <!-- 03 Chunk and embed -->
  <g>
    <rect class="node-card step-2" x="430" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="448" y="216">03 / EMBED</text>
    <rect class="icon-fill" x="452" y="240" width="28" height="30" rx="4" />
    <rect class="icon-fill" x="486" y="247" width="28" height="30" rx="4" />
    <rect class="icon-fill" x="520" y="240" width="28" height="30" rx="4" />
    <path class="icon-stroke" d="M458 249h16M458 256h12M492 256h16M492 263h12M526 249h16M526 256h12" />
    <text class="node-title" x="448" y="312">Chunk + embed</text>
    <text class="node-copy" x="448" y="333">500 chars · overlap</text>
    <text class="node-copy" x="448" y="350">MiniLM vectors</text>
  </g>

  <!-- 04 Store -->
  <g>
    <rect class="node-card step-3" x="620" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="638" y="216">04 / INDEX</text>
    <ellipse class="icon-fill" cx="700" cy="246" rx="28" ry="9" />
    <path class="icon-stroke" d="M672 246v25c0 5 13 9 28 9s28-4 28-9v-25M672 258c0 5 13 9 28 9s28-4 28-9M672 270c0 5 13 9 28 9s28-4 28-9" />
    <text class="node-title" x="638" y="312">Store vectors</text>
    <text class="node-copy" x="638" y="333">ChromaDB keeps</text>
    <text class="node-copy" x="638" y="350">text + page metadata</text>
  </g>

  <!-- 05 Retrieve -->
  <g>
    <rect class="node-card step-4" x="810" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="828" y="216">05 / RETRIEVE</text>
    <circle class="icon-stroke" cx="865" cy="253" r="16" />
    <path class="icon-stroke" d="m877 265 13 13M857 253h16M865 245v16" />
    <path class="icon-stroke" d="M900 244h30M900 253h24M900 262h18" />
    <text class="node-title" x="828" y="312">Find evidence</text>
    <text class="node-copy" x="828" y="333">Question vector →</text>
    <text class="node-copy" x="828" y="350">top 3 matching chunks</text>
  </g>

  <!-- 06 Generate -->
  <g>
    <rect class="node-card step-5" x="1000" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="1018" y="216">06 / GENERATE</text>
    <path class="icon-fill" d="m1070 236 7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" />
    <path class="icon-stroke" d="M1042 244h10M1047 239v10M1108 267h9M1112.5 262.5v9" />
    <text class="node-title" x="1018" y="312">Gemini answers</text>
    <text class="node-copy" x="1018" y="333">Question + retrieved</text>
    <text class="node-copy" x="1018" y="350">context → Gemini</text>
  </g>

  <!-- 07 Respond -->
  <g>
    <rect class="node-card step-6" x="1190" y="190" width="160" height="174" rx="15" />
    <text class="step-label" x="1208" y="216">07 / RESPONSE</text>
    <path class="icon-fill" d="M1218 240h104a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8h-49l-14 11v-11h-41a8 8 0 0 1-8-8v-24a8 8 0 0 1 8-8z" />
    <path class="icon-stroke" d="M1227 252h79M1227 260h65M1227 268h47" />
    <text class="node-title" x="1208" y="312">Answer + sources</text>
    <text class="node-copy" x="1208" y="333">Concise response</text>
    <text class="node-copy" x="1208" y="350">with page references</text>
  </g>

  <path d="M54 414h1292" stroke="#eee" />
  <circle cx="62" cy="448" r="4" fill="#111" />
  <text class="footer" x="75" y="452">INGESTION: PDF → CHUNKS → EMBEDDINGS → VECTOR STORE</text>
  <text class="footer" x="773" y="452">QUERY: QUESTION → SIMILARITY SEARCH → GROUNDED ANSWER</text>
</svg>
